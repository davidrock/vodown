[package]
name = "vodown"
version = "0.1.0"
description = "Vodown desktop"
edition = "2021"
default-run = "vodown"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.3.7", features = ["deep-link"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "=0.10.3"

reqwest = { version = "=0.13.5", features = ["blocking", "json"] }
